[package]
name = "google-firebase"
version = "0.1.1"
edition = "2021"
description = "Mini-SDK: OAuth2 de service account (Google) + verificação de ID token e custom claims (Firebase Auth)"

[dependencies]
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "form",
    "query",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
dotenv = "0.15.0"
