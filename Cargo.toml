[package]
name = "google-firebase"
version = "0.1.0"
edition = "2021"
description = "Mini-SDK: OAuth2 de service account (Google) + verificação de ID token e custom claims (Firebase Auth)"

[dependencies]
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
dotenv = "0.15.0"
